<footer role="contentinfo">
  <div class="container">
    <div class="footer-left">
      <p>{{ data().message }}</p>
    </div>
    <div class="footer-right">
      <!-- TODO: Hardcode footer links -->
      @for (link of data().links; track link.label){
      <a [href]="link.url"> {{ link.label }}</a>
      }
    </div>
  </div>
</footer>
