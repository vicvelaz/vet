<footer role="contentinfo">
  <div class="container">
    <p class="footer-copy">{{ data().message }}</p>
    <nav class="footer-links" aria-label="Enlaces legales">
      @for (link of data().links; track link.label) {
        <a [href]="link.url">{{ link.label }}</a>
      }
    </nav>
  </div>
</footer>
