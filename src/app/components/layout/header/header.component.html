<header
  class="header"
  [class.header--scrolled]="scrolled()"
  [class.header--hidden]="hidden()"
  role="banner"
>
  <div class="container">
    <button
      class="logo"
      type="button"
      (click)="scrollToSection('inicio')"
      aria-label="Ir al inicio"
    >
      <img
        class="logo-img"
        [class.logo--scrolled]="scrolled()"
        [src]="data().logo"
        alt="Logo"
      />
      <span class="logo-text">{{ data().name }}</span>
    </button>

    <nav
      class="nav-links"
      role="navigation"
      aria-label="Navegación principal"
    >
      @for (link of data().links; track link.label) {
        <a
          class="nav-link"
          [href]="'#' + link.url"
          (click)="scrollToSection(link.url)"
          >{{ link.label }}</a
        >
      }
    </nav>

    <a
      class="contact-btn"
      [href]="data().button.url"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="data().button.label"
    >
      {{ data().button.label }}
    </a>

    <button
      #menuToggle
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-navigation"
      [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
      type="button"
    >
      <span
        class="menu-toggle__bar"
        [class.open]="menuOpen"
      ></span>
      <span
        class="menu-toggle__bar"
        [class.open]="menuOpen"
      ></span>
      <span
        class="menu-toggle__bar"
        [class.open]="menuOpen"
      ></span>
    </button>
  </div>

  <!-- Mobile menu overlay -->
  @if (menuOpen) {
    <nav
      id="mobile-navigation"
      class="mobile-nav"
      aria-label="Navegación móvil"
    >
      @for (link of data().links; track link.label) {
        <a
          class="mobile-nav__link"
          #firstMobileLink
          [href]="'#' + link.url"
          (click)="scrollToSection(link.url)"
        >
          {{ link.label }}
        </a>
      }
      <a
        class="mobile-nav__cta"
        [href]="data().button.url"
        target="_blank"
        rel="noopener noreferrer"
        (click)="closeMenu()"
      >
        {{ data().button.label }}
      </a>
    </nav>
  }
</header>
