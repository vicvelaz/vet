<section id="horario" class="timetable">
  <div class="container">
    <div class="left-content">
      <p class="eyebrow" appReveal>Nuestro horario</p>
      <h2 class="section-title" appReveal [delay]="0.1">{{ data().title }}</h2>

      <div class="hours-table" appReveal [delay]="0.2">
        @for (item of data().items; track $index) {
          <div class="hours-row">
            <span class="hours-day">{{ item.day }}</span>
            <span class="hours-time">{{ item.hours }}</span>
          </div>
        }
      </div>

      <div class="recommendation" appReveal [delay]="0.35">
        <fa-icon
          [icon]="icons[data().recomendation.icon]"
          class="recommendation__icon"
          size="sm"
        ></fa-icon>
        <span>{{ data().recomendation.text }}</span>
      </div>
    </div>

    <div class="right-content" appReveal direction="left" [delay]="0.15">
      <img src="img/local-entrada.webp" alt="Entrada de la cl&iacute;nica veterinaria" />
    </div>
  </div>
</section>
