<section id="seguros" class="insurances">
  <div class="container">
    <div class="section-header" appReveal>
      <p class="eyebrow">Protecci&oacute;n para tu mascota</p>
      <h2 class="section-title">{{ data().title }}</h2>
      @if (data().subtitle) {
        <p class="section-description">{{ data().subtitle }}</p>
      }
    </div>

    <div class="insurances-cards">
      @for (item of data().items; track $index; let i = $index) {
        <div class="insurances-card" appReveal [delay]="0.1 + i * 0.12">
          @if (item.offer) {
            <div class="offer-badge">{{ item.offer }}</div>
          }
          <div class="card-body">
            <div>
              <h3 class="card-title">{{ item.title }}</h3>
              <p class="card-description">{{ item.description }}</p>
            </div>
            <button
              class="info-btn"
              mat-flat-button
              [disabled]="!item.image"
              (click)="openDialog(item.image)"
            >
              {{ item.label }}
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</section>
